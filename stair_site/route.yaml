# 现场最小流程：从当前有效定位出发，只执行 APPROACH_A，到 A 点保持后结束。
# 软件联调参考值已填写；必须现场确认的字段保留 null，补齐前不能启动。
# 已填写的控制参数是参考基线，需通过实机响应和到达测试后再定型。
# 保留 null 字段旁的“例”仅说明格式，不会自动生效。
# 距离用 m，时间用 s，角度用 rad；90° = 1.5707963267948966 rad。
# 结构参考 ../stair_nav/stair_nav/demo/config/route.yaml。
# 请使用实测数据，不要直接复制 demo 坐标、速度、能力或到达容差。

frame: map  # 须与地图和定位的坐标基准一致。
reference_point: ground_projection  # 保留：地面支撑参考点。
sequence: [APPROACH_A]  # 保留：仅执行这一段。
control_period: 0.05  # 参考：控制周期，s，对应 20 Hz。
command_ttl: 0.2  # 参考：单条指令有效期，s，不超过适配器 command_max_ttl。

# 已接入 ~/map_2d 的二维栅格；现场坐标、净空和最低有效线速度仍待确认。
# floor_1 是内部地图标识，实际楼层、frame 和支撑高度仍需现场确认。
# 后续使用其他平台或楼梯地图的路段需显式覆盖这两个字段。
defaults:
  platform_id: floor_1  # 内部标识字符串；须与地图中的 platform_id 一致。
  grid_file: maps/floor_1.yaml  # 相对本 route.yaml 的地图路径。
  allowed_modes: [flat]  # 字符串列表；本次仅平地。
  required_capabilities: [turn_in_place]  # 能力列表；例：[turn_in_place]，仅实测验证后声明。
  tracking:
    lookahead: 0.4  # 参考：前视距离，m。
    max_vx: 0.25  # 参考：最大前进速度，m/s；不超过适配器 max_vx。
    max_wz: 0.5  # 参考：最大角速度，rad/s（约 28.65°/s）。
    max_accel: 0.3  # 参考：线加速度限制，m/s²。
    max_angular_accel: 0.6  # 参考：角加速度限制，rad/s²。
    slowdown_distance: 0.8  # 参考：距路径终点开始减速的距离，m。
    min_vx: 0.1  # 待实测：减速计算的速度下限，m/s；例：0.15，须 <= max_vx。
    # min_vx 后仍会进行航向缩放和加速度限制，实际瞬时指令可能更小。
    max_cross_track: 0.3  # 参考：允许的水平路径偏差，m，需结合现场净空复核。
    max_height_error: 0.15  # 参考：允许的路径高度偏差，m。
    match_backtrack: 0.15  # 参考：路径匹配向后搜索距离，m；允许为 0。
    match_forward: 1.0  # 参考：路径匹配向前搜索距离，m。
    heading_stop_threshold: 1.0  # 参考：停止前进的航向误差阈值，rad（约 57.3°）。
    # 未验证的能力先关闭；若启用，需要同步适配器的已验证 capabilities。
    allow_turn_in_place: true  # 布尔值；验证 turn_in_place 能力后才可写 true。
    allow_reverse: false  # 布尔值；验证 reverse 能力后才可写 true。
    allow_stair_correction: false  # 布尔值；本次平地测试保留 false。
  planning:
    timeout: 3.0  # 参考：单次规划时限，s。
    max_jump: 0.5  # 参考：预设路径相邻点最大间距，m；本次仅配置校验要求填写。
    join_xy: 0.25  # 参考：预设路径入口 XY 邻域，m；本次仅配置校验要求填写。
    join_z: 0.15  # 参考：规划期间起点允许的高度变化，m；也用于预设路径入口。
    inflation_radius: 0.4  # 待实测：障碍膨胀半径，m；例：0.4，按机体/负载尺寸及误差确定。
    unknown_is_obstacle: true  # 布尔值；将未知栅格按障碍处理。
    simplify: true  # 布尔值；在碰撞检查通过时简化栅格路径。
  timeouts:
    ready: 5.0  # 参考：段执行器等待运控就绪的时限，s。
    execution: 60.0  # 参考：开始跟踪后的段执行时限（含到达确认），s。
    pose: 0.5  # 参考：定位观测允许的最大数据年龄，s。
    status: 0.5  # 参考：运动反馈允许的最大数据年龄，s。
    arrival: 8.0  # 参考：几何到达后等待保持等确认的时限，s。

nodes:
  A:
    position: [2.0, 0.0, 0.05]  # 已选定地图 X=2 m、Y=0 m；支撑参考 Z 待确认。
    yaw: 0.0  # 最终朝向地图 +X 方向，单位 rad。
    arrival:
      xy: 0.15  # 参考：目标点水平距离容差，m。
      z: 0.10  # 参考：目标点高度容差，m。
      yaw: 0.17453292519943295  # 参考：朝向误差容差，rad，即 10°。
      progress: 0.97  # 参考：路径进度阈值；无量纲，0 < 值 <= 1，不能写 97。
      confirm_seconds: 0.5  # 参考：到达和保持条件须连续满足的时长，s。
      require_exit: false  # 布尔值；本次平地段保留 false。
      require_stable: true  # 布尔值；要求真实稳定反馈。
      require_hold: true  # 布尔值；要求真实保持确认。
      required_mode: flat  # 字符串；到达时应处于平地模式。

segments:
  APPROACH_A:
    # start/end 为路线节点引用；规划起点由实时定位提供，无需预设起点坐标。
    start: A
    end: A
    kind: platform  # 本次使用单一平台。
    backend: grid_astar  # 本次使用已转换的占据栅格规划。
    mode: flat  # 本次只请求平地运动模式。
