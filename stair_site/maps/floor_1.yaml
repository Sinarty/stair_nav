frame: null
platform_id: floor_1  # 与引用本地图的路段 platform_id 保持一致。
height_z: null  # TODO：该平台的支撑表面高度，单位 m。
width: null
height: null
resolution: null  # TODO：每格尺寸，单位 m。
origin: []  # TODO：[x, y]，不包含旋转角。
data: []  # TODO：height 行、width 列的占据矩阵，按 data[y][x] 排列。

