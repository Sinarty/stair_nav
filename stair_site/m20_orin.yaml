# M20 PRO vendor ROS interfaces, not the policy-deployment SDK.
# This file contains no site coordinates or fabricated vendor message types.
# 以下现有值也作为填写格式示例；话题/状态码/步态须与本机固件匹配。
# 距离用 m，时间用 s，角速度用 rad/s；布尔值写 true/false，不加引号。
m20_localization:
  ros__parameters:
    odom_topic: /ODOM  # 话题名字符串，输入 nav_msgs/msg/Odometry。
    location_status_topic: /LOCATION_STATUS  # 原厂定位质量话题名字符串。
    location_status_type: drdds/msg/LocationStatus  # ROS 消息类型字符串，须匹配实际厂商类型。
    output_pose_topic: /localization/pose  # 转换后的支撑参考 PoseStamped 输出话题。
    navigation_reference_frame: navigation_ground_reference  # 已标定的支撑参考 TF 坐标系名称。
    normal_location_status: -1  # 整数；-1 为未确认；例：1，仅在本机正常码确认为 1 时填写，也可能为 0。
    odom_qos_reliability: best_effort  # 字符串，可选 best_effort/reliable，按实际发布端匹配。
    status_qos_reliability: best_effort  # 字符串，可选 best_effort/reliable。
    odom_timeout: 0.5  # s，定位观测允许的最大年龄。
    location_status_timeout: 1.5  # s，定位质量观测允许的最大年龄。
    tf_retry_period: 0.05  # s，等待晚到 TF 时的重试周期。
    max_pending_odometry: 32  # 正整数，待转换的最大 ODOM 帧数。

m20_motion_adapter:
  ros__parameters:
    dry_run: true  # 布尔值；true 为只读，false 允许后续显式启用；launch 会覆盖本值。
    navigation_mode_confirmed: false  # 布尔值；人工确认已处于导航使用模式后才声明 true。
    planner_stopped: false  # 布尔值；人工确认原厂冲突 planner 已停止后才声明 true。
    normal_location_status: -1  # 整数；确认 0 或 1，与定位适配器一致；launch 会覆盖两处正常码。
    publish_rate: 20.0  # Hz，发布/看门狗频率；代码允许 10.0～100.0。
    command_topic: /navigation/command  # 导航 ControlCommand 输入话题名。
    motion_status_topic: /motion/status  # 导航 MotionStatus 反馈输出话题名。
    nav_cmd_topic: /NAV_CMD  # 原厂速度指令输出话题名。
    motion_info_topic: /MOTION_INFO  # 原厂真实运动反馈输入话题名。
    gait_topic: /GAIT  # 原厂步态请求输出话题名。
    location_status_topic: /LOCATION_STATUS  # 原厂定位质量输入话题名。
    location_status_type: drdds/msg/LocationStatus  # 固件匹配的 ROS 消息类型字符串。
    imu_topic: /IMU  # sensor_msgs/msg/Imu 输入话题名。
    hard_estop_topic: /HES_STATUS  # 原厂硬急停状态输入话题名。
    charge_status_topic: /CHARGE_STATUS  # 原厂充电/冲突状态输入话题名。
    confirmation_topic: /m20/confirmation  # 外部保持/出梯监督话题；本次纯平地保留。
    flat_gait: 12290  # 整数步态编号，示例 12290 = 0x3002；以真实 MOTION_INFO 确认为准。
    stair_gait: 12291 # 整数步态编号；本次纯平地保留，不请求楼梯模式。
    supported_modes: [flat]  # 字符串列表；本次保留仅平地。
    capabilities: [turn_in_place] # 字符串列表；例：[turn_in_place]，仅实测验证后添加。
    max_vx: 0.3  # m/s，适配器独立线速度上限；应 >= 路线 tracking.max_vx。
    max_wz: 0.6  # rad/s，适配器独立角速度上限；应 >= 路线 tracking.max_wz。
    motion_timeout: 0.5  # s，原厂运动观测允许的最大年龄。
    imu_timeout: 0.5  # s，IMU 观测允许的最大年龄。
    location_timeout: 1.5  # s，原厂定位质量观测允许的最大年龄。
    safety_timeout: 3.0  # s，急停/充电状态接收后允许的最大年龄。
    command_max_ttl: 0.5  # s，允许的最大指令有效期；路线 command_ttl 默认 0.2 s。
    stable_seconds: 0.35  # s，真实速度和 IMU 需连续稳定的时长。
    linear_stable_threshold: 0.03  # m/s，平面合速度 <= 此值才视为静止候选。
    yaw_stable_threshold: 0.05  # rad/s，实际 yaw 角速度绝对值阈值（约 2.86°/s）。
    gyro_stable_threshold: 0.08  # rad/s，IMU 三轴角速度向量模长阈值。
    confirmation_timeout: 1.0  # s，外部监督证据有效期；本次纯平地保留。
    gait_timeout: 3.0  # s，等待真实步态切换反馈的时限。
    # Documented nonzero effective minima (firmware >= V1.1.7).
    # Used for diagnostics, NEVER to boost a small requested velocity.
    flat_min_vx: 0.15  # m/s，平地非零线速度死区诊断阈值，须实测核对。
    stair_min_vx: 0.15  # m/s，楼梯诊断阈值；本次纯平地保留。
    flat_min_wz: 0.35  # rad/s，平地非零角速度死区诊断阈值（约 20.05°/s）。
    stair_min_wz: 0.4  # rad/s，楼梯诊断阈值；本次纯平地保留。
